config:
  ul-style:
    style: dash
  ul-indent:
    indent: 2
  commands-show-output: false
  no-bare-urls: false
  line-length: false
  no-emphasis-as-heading: false
  no-duplicate-header: false
  no-duplicate-heading:
    siblings_only: true
  header-increment: false
  no-blanks-blockquote: false
  no-inline-html: false
  first-line-heading: false
  first-line-h1: false
  code-block-style: false
  MD060: false
ignores:
  - '**/node_modules/**'
  - '**/CHANGELOG.md' # generated
  - 'docs/**/*.md'
  - '.worktrees/**/*.md'
  - '.claude/**/*.md'
  - '.plans/**/*.md'
  # Generated by bd; regenerated on `bd init`/`bd setup`, so not ours to fix
  - '.beads/**/*.md'
  - '.agents/**/*.md'
  # Upstream docs copied verbatim (ruby/rbs, rbs-inline, sorbet.org), MIT.
  # Single-level glob on purpose: it covers the copied files themselves while
  # leaving the STRUCTURE.md navigation nested beside the corpora linted, since
  # that navigation is ours. A `**` here silently hid a broken STRUCTURE.md.
  - 'plugins/ruby-rails/skills/generating-rbs/references/*.md'
  - 'plugins/ruby-rails/skills/generating-rbs-inline/references/*.md'
  - 'plugins/ruby-rails/skills/generating-sorbet/references/*.md'
  - 'plugins/ruby-rails/skills/generating-sorbet-inline/references/*.md'
outputFormatters:
  - - 'markdownlint-cli2-formatter-pretty'
    - appendLink: true
showFound: true
noProgress: false